<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>∇·Chat 개발 안내</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      :root {
        --bg: #0b0f14;
        --panel: #0f1520;
        --text: rgba(235, 239, 244, 0.92);
        --muted: rgba(235, 239, 244, 0.65);
        --border: rgba(148, 163, 184, 0.18);
        --primary: #58a6ff;
      }
      html, body { height: 100%; }
      body { background: var(--bg); color: var(--text); font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, system-ui, sans-serif; }
      .wrap { max-width: 880px; margin: 0 auto; padding: 32px 20px; }
      .hero { display: flex; align-items: center; gap: 14px; margin-bottom: 20px; }
      .logo { width: 40px; height: 40px; display: grid; place-items: center; border-radius: 10px; background: linear-gradient(135deg,#12c2e9,#c471ed,#f64f59); }
      .title { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
      .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 12px; padding: 16px; }
      .panel + .panel { margin-top: 14px; }
      .panel h2 { font-size: 14px; font-weight: 600; margin-bottom: 10px; color: var(--muted); }
      .row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .btn { display: inline-flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid var(--border); background: #0e1420; color: var(--text); border-radius: 8px; text-decoration: none; font-size: 14px; }
      .btn:hover { border-color: rgba(88,166,255,0.4); color: var(--primary); }
      code { background: #0e1420; border: 1px solid var(--border); padding: 3px 6px; border-radius: 6px; }
      ul { padding-left: 18px; }
      li { margin: 6px 0; color: var(--muted); }
    </style>
  </head>
  <body>
    <div class="wrap">
      <div class="hero">
        <div class="logo"><span style="color:#fff;font-weight:800;">∇</span></div>
        <div class="title">∇·Chat 개발 안내</div>
      </div>

      <div class="panel">
        <h2>사이드패널 미리보기</h2>
        <div class="row">
          <a class="btn" href="/sidepanel.html">사이드패널 열기</a>
          <span style="color:var(--muted);">또는 단축키 <code>Ctrl+Shift+S</code> / <code>Command+Shift+S</code></span>
        </div>
      </div>

      <div class="panel">
        <h2>개발 서버</h2>
        <ul>
          <li>개발: <code>pnpm dev</code> → <code>http://localhost:3000/</code> 접속</li>
          <li>빌드: <code>pnpm build</code> → <code>dist</code> 폴더를 크롬 확장으로 로드</li>
          <li>사이드패널 경로: <code>/sidepanel.html</code></li>
        </ul>
      </div>
    </div>
  </body>
  </html>
